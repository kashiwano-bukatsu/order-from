<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文フォーム｜カシワのBUKATSU 1周年記念グッズ</title>
<style>
  :root{
    --green:#1f6f43; --lime:#9fd62b; --pink:#e0359e; --ink:#1c1f1d; --mute:#6b726d;
    --bg:#f5f7f4; --card:#fff; --line:#dfe5df; --err:#c0262d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--green),#123d26);color:#fff;padding:28px 20px 24px;text-align:center}
  header .tag{display:inline-block;background:var(--lime);color:#123d26;font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;margin-bottom:8px}
  header h1{margin:0;font-size:22px;line-height:1.35}
  header p{margin:8px 0 0;font-size:13px;opacity:.9}
  main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  .tabs{display:flex;gap:8px;margin:0 0 16px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute)}
  .tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .card img{width:100%;display:block;background:#eee}
  .card .body{padding:14px 16px 16px}
  .card h2{margin:0 0 2px;font-size:17px}
  .price{color:var(--mute);font-size:14px;margin-bottom:10px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  .hint{font-weight:400;color:var(--mute);font-size:12px}
  input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid var(--line);border-radius:99px;font-size:14px;background:#fff;cursor:pointer;user-select:none}
  .chip.on{border-color:var(--green);background:#e8f4ec;font-weight:700}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid #0003}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--green);color:#fff;margin-top:14px}
  .btn.sub{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn.danger{background:#fff;color:var(--err);border:1.5px solid var(--err)}
  .btn:disabled{opacity:.5}
  .err{color:var(--err);font-size:13px;margin-top:8px;min-height:1em}
  .cartline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .cartline:last-child{border:0}
  .cartline .x{color:var(--err);background:none;border:0;font-size:13px;white-space:nowrap}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:5}
  .bar .sum{flex:1;font-size:13px;color:var(--mute)}
  .bar .sum b{display:block;font-size:16px;color:var(--ink)}
  .bar button{padding:12px 22px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:700;font-size:15px}
  .bar .sum{cursor:pointer}
  .bar .sum span::after{content:" ▲";font-size:11px}
  .bar.open .sum span::after{content:" ▼"}
  .sheet{position:fixed;left:0;right:0;bottom:var(--barh,70px);background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px #0002;max-height:55vh;overflow:auto;padding:12px 16px;z-index:4}
  .sheet h3{margin:0 0 4px;font-size:15px}
  .sheet .inner{max-width:560px;margin:0 auto}
  .sheet .empty{color:var(--mute);font-size:14px;padding:10px 0}
  .agree{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px;margin:10px 0 0}
  .agree input{width:22px;height:22px;flex:none;margin:0}
  .policy{background:#f5f7f4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line;margin-top:6px}
  .sumrows{margin-top:10px;font-size:14px}
  .sumrows div{display:flex;justify-content:space-between;padding:2px 0}
  .sumrows .grand{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
  .disc{color:var(--pink)}
  .stat-badge{display:inline-block;background:#fff0f8;color:var(--pink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:99px;margin:0 0 10px}
  .lnk{color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer}
  .dtable{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
  .dtable td{padding:7px 4px;border-bottom:1px solid var(--line)}
  .dtable td:last-child{text-align:right;font-weight:700;color:var(--pink)}
  .no{font-size:24px;font-weight:800;letter-spacing:.08em;color:var(--green);margin:4px 0 8px}
  .modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal .box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal .btns{display:flex;gap:10px;margin-top:16px}
  .modal .btns .btn{margin-top:0}
  .notice{background:#fff8e1;border:1px solid #f0dd9a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}
  .done{text-align:center;padding:30px 10px}
  .done .no{font-size:30px;font-weight:800;letter-spacing:.05em;color:var(--green);margin:6px 0}
  .hidden{display:none}
  .closed{text-align:center;padding:40px 10px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="tag">1st ANNIVERSARY</div>
  <h1>カシワのBUKATSU<br>1周年記念グッズ 注文フォーム</h1>
  <p>受付は <b>11/15（日）23:59</b> まで</p>
</header>

<main>
  <div class="tabs">
    <button id="tabOrder" class="on">注文する</button>
    <button id="tabCheck">注文書・キャンセル</button>
  </div>
  <div id="loading" class="closed">読み込み中…</div>
  <div id="viewOrder" class="hidden"></div>
  <div id="viewCheck" class="hidden"></div>
  <div id="viewDone" class="hidden"></div>
</main>

<div class="sheet hidden" id="sheet"><div class="inner"><h3>🛒 カートの中身</h3><div id="sheetList"></div></div></div>
<div class="bar hidden" id="bar">
  <div class="sum"><span id="barCount">0点</span><b id="barTotal"></b></div>
  <button id="barBtn">注文内容を確認</button>
</div>

<script>
/* ★ GASをウェブアプリとしてデプロイしたURLをここに貼る */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_5TfUEjFaLjdi1MXQXOt2TibdbfwBh9NhGJ8EbOJSYzxivu3ObuTi9cK3lT8ik8CU/exec';

const $ = (id) => document.getElementById(id);
let CONFIG = null;
let cart = [];
let customerName = '';
let confirming = false;
let NUM_COUNTS = {};
let ITEM_STATS = {};

const isClosedNow = () => !!(CONFIG && CONFIG.deadline && new Date() > new Date(CONFIG.deadline));
const yen = (n) => '¥' + Number(n).toLocaleString('ja-JP');
const priceText = (it) => it.price == null ? '価格は後日お知らせ' : yen(it.price);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach((c) => c != null && e.append(c));
  return e;
}

async function api(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライト回避
    body: JSON.stringify(body)
  });
  return res.json();
}

/* ---------- 起動 ---------- */
async function init() {
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();
    CONFIG = data.config;
    NUM_COUNTS = data.numberCounts || {};
    ITEM_STATS = data.itemStats || {};
    // 表示順：半袖 → ロングT → リバーシブル（ユニフォーム）
    const ORDER = ['tee', 'long', 'uniform'];
    CONFIG.items.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
    $('loading').classList.add('hidden');
    if (data.closed) {
      showClosed();
    } else {
      renderOrder();
    }
    show('order');
    renderCheck();
  } catch (e) {
    $('loading').textContent = '読み込みに失敗しました。通信状況を確認して、ページを再読み込みしてください。';
  }
}

function showClosed() {
  confirming = true;
  cart = [];
  setSheet(false);
  $('bar').classList.add('hidden');
  $('viewOrder').replaceChildren(el('div', { class: 'card' }, el('div', { class: 'body closed' },
    el('h2', { text: 'ご注文の受付は終了しました' }),
    el('p', { text: '受付期間は11/15（日）23:59まででした。ご注文済みの方は、上の「注文書・キャンセル」から注文書を確認できます。ご不明点は運営までご連絡ください。' })
  )));
}

function show(which) {
  ['Order', 'Check', 'Done'].forEach((n) => $('view' + n).classList.add('hidden'));
  $('view' + (which === 'order' ? 'Order' : which === 'check' ? 'Check' : 'Done')).classList.remove('hidden');
  $('tabOrder').classList.toggle('on', which === 'order');
  $('tabCheck').classList.toggle('on', which === 'check');
  setSheet(false);
  $('bar').classList.toggle('hidden', which !== 'order' || !cart.length || confirming);
  window.scrollTo(0, 0);
}
$('tabOrder').onclick = () => show('order');
$('tabCheck').onclick = () => show('check');

/* ---------- 注文画面 ---------- */
const IMG = { uniform: 'order2.jpeg', long: 'order1.jpeg', tee: 'order3.jpeg' };

function chipGroup(options, onPick) {
  const wrap = el('div', { class: 'chips' });
  let value = '';
  options.forEach((o) => {
    const label = typeof o === 'string' ? o : o.name;
    const chip = el('div', { class: 'chip' }, o.hex ? el('span', { class: 'dot', style: 'background:' + o.hex }) : null, label);
    chip.onclick = () => {
      value = label;
      wrap.querySelectorAll('.chip').forEach((c) => c.classList.remove('on'));
      chip.classList.add('on');
      onPick && onPick(label);
    };
    wrap.append(chip);
  });
  return { node: wrap, get: () => value };
}

function itemCard(it) {
  const card = el('div', { class: 'card' });
  card.append(el('img', { src: IMG[it.id], alt: it.name, loading: 'lazy' }));
  const body = el('div', { class: 'body' });
  body.append(el('h2', { text: it.name }), el('div', { class: 'price', text: priceText(it) }));
  if (ITEM_STATS[it.id] != null) {
    body.append(el('div', { class: 'stat-badge', text: '現在の注文：' + ITEM_STATS[it.id] + '枚' }));
  }
  if (it.priceNote) body.append(el('div', { class: 'hint', style: 'margin:-6px 0 8px', text: it.priceNote }));

  const fields = {};
  if (it.colors) {
    body.append(el('label', { text: '色' }));
    fields.color = chipGroup(it.colors);
    body.append(fields.color.node);
  }
  if (it.logos) {
    body.append(el('label', { text: 'ロゴの大きさ' }));
    fields.logo = chipGroup(it.logos);
    body.append(fields.logo.node);
  }
  if (it.custom) {
    body.append(el('label', {}, '背面の名前 ', el('span', { class: 'hint', text: 'ローマ字・12文字まで（例: CONPEY）' })));
    fields.printName = el('input', { type: 'text', maxlength: '12', autocapitalize: 'characters', placeholder: 'CONPEY' });
    body.append(fields.printName);
    body.append(el('label', {}, '背番号の候補 ', el('span', { class: 'hint', text: '0〜99から最大3つ（希望順）。（ ）は現在の希望件数。重複は運営で調整します' })));
    fields.nums = [1, 2, 3].map((i) => el('select', {},
      el('option', { value: '', text: '第' + i + '希望' }),
      Array.from({ length: 100 }, (_, n) => {
        const c = NUM_COUNTS[String(n)] || 0;
        return el('option', { value: String(n), text: c ? n + '（希望' + c + '件）' : String(n) });
      })));
    body.append(el('div', { class: 'row' }, fields.nums));
  }

  body.append(el('div', { class: 'row' },
    el('div', {}, el('label', { text: 'サイズ' }), (fields.size = el('select', {}, el('option', { value: '', text: '選択' }), it.sizes.map((s) => el('option', { value: s, text: s }))))),
    el('div', {}, el('label', { text: '数量' }), (fields.qty = el('select', {}, [1, 2, 3, 4, 5].map((n) => el('option', { value: n, text: n + '点' })))))
  ));

  const err = el('div', { class: 'err' });
  body.append(err);
  body.append(el('button', { class: 'btn sub', text: 'カートに追加', onclick: () => {
    const line = { itemId: it.id, itemName: it.name, size: fields.size.value, qty: Number(fields.qty.value) };
    if (fields.color) line.color = fields.color.get();
    if (fields.logo) line.logo = fields.logo.get();
    if (fields.color && !line.color) return (err.textContent = '色を選んでください');
    if (fields.logo && !line.logo) return (err.textContent = 'ロゴの大きさを選んでください');
    if (it.custom) {
      line.printName = fields.printName.value.trim().toUpperCase();
      if (!/^[A-Z][A-Z .\-]{0,11}$/.test(line.printName)) return (err.textContent = '背面の名前はローマ字で入力してください');
      line.numbers = fields.nums.map((n) => n.value.trim()).filter(Boolean);
      if (!line.numbers.length) return (err.textContent = '背番号の候補を1つ以上入力してください');
      if (line.numbers.some((n) => !/^\d{1,2}$/.test(n))) return (err.textContent = '背番号は0〜99の数字で入力してください');
      if (new Set(line.numbers.map(Number)).size !== line.numbers.length) return (err.textContent = '背番号の候補が重複しています');
    }
    if (!line.size) return (err.textContent = 'サイズを選んでください');
    err.textContent = '';
    cart.push(line);
    updateBar();
    err.style.color = 'var(--green)';
    err.textContent = '✓ カートに追加しました';
    setTimeout(() => { err.textContent = ''; err.style.color = ''; }, 2000);
  } }));
  card.append(body);
  return card;
}

function renderOrder() {
  confirming = false;
  const v = $('viewOrder');
  v.replaceChildren(
    el('div', { class: 'notice', text: '欲しい商品を選んで「カートに追加」→ 下の「注文内容を確認」で完了です。キャンセルは11/15まで、このページの「注文書・キャンセル」からできます。' }),
    discNote(),
    ...CONFIG.items.map(itemCard)
  );
}

function lineLabel(l) {
  return [l.itemName, l.color, l.logo, l.printName && ('名前 ' + l.printName), l.numbers && ('背番号候補 ' + l.numbers.join(' / ')), 'サイズ ' + l.size, '×' + l.qty].filter(Boolean).join('　');
}

function calcDisc(D, pieces, sub) {
  if (!D || !D.enabled || pieces < 1) return 0;
  let d = 0;
  if (D.type === 'tiered') {
    const t = D.tiers;
    d = pieces <= t.length ? t[pieces - 1] : t[t.length - 1] + (pieces - t.length) * D.extra;
  } else if (D.type === 'yen') {
    d = Number(D.value) || 0;
  } else {
    d = Math.floor(sub * (Number(D.value) || 0) / 100);
  }
  return Math.max(0, Math.min(d, sub));
}

function total() {
  let sub = 0, unknown = false, pieces = 0, provisional = false;
  cart.forEach((l) => {
    const it = CONFIG.items.find((i) => i.id === l.itemId);
    pieces += l.qty;
    if (it.priceNote) provisional = true;
    if (it.price == null) unknown = true; else sub += it.price * l.qty;
  });
  const D = CONFIG.discount || {};
  const disc = unknown ? 0 : calcDisc(D, pieces, sub);
  return { sub, disc, t: sub - disc, unknown, pieces, provisional, label: D.label || '会員特別割引' };
}

function discNote(style) {
  const D = CONFIG.discount || {};
  if (!D.enabled) return null;
  return el('div', { class: style || 'notice' },
    '※ カシワのBUKATSU会員様は、会員割引が自動で適用されます。',
    el('a', { class: 'lnk', text: '詳しくはこちら', onclick: (e) => { e.preventDefault(); openDiscountInfo(); } })
  );
}

function openDiscountInfo() {
  const D = CONFIG.discount || {};
  const rows = [];
  if (D.type === 'tiered') {
    for (let n = 1; n <= D.tiers.length + 3; n++) {
      rows.push([n === D.tiers.length + 3 ? n + '枚以上は同様に…' : n + '枚', n === D.tiers.length + 3 ? '' : yen(calcDisc(D, n, 1e9))]);
    }
  } else {
    rows.push(['ご注文全体', D.type === 'yen' ? yen(D.value) + '引き' : D.value + '％引き']);
  }
  const close = () => modal.remove();
  const modal = el('div', { class: 'modal', onclick: (e) => { if (e.target === modal) close(); } }, el('div', { class: 'box' },
    el('h3', { text: '会員割引について' }),
    el('div', { class: 'hint', text: 'カシワのBUKATSU会員様は、合計金額から下記の金額が自動で引かれます。' }),
    el('table', { class: 'dtable' }, ...rows.map(([a, b]) => el('tr', {}, el('td', { text: a }), el('td', { text: b })))),
    D.type === 'tiered' ? el('div', { class: 'hint', style: 'margin-top:8px', text: 'それ以降は、1枚増えるごとに' + yen(D.extra) + 'ずつ割引額が増えます。' }) : null,
    el('div', { class: 'hint', style: 'margin-top:6px', text: '割引は、ご注文全体の合計枚数で計算します（商品の種類は問いません）。' }),
    el('button', { class: 'btn', text: '閉じる', onclick: close })
  ));
  document.body.append(modal);
}

function renderSheet() {
  const list = $('sheetList');
  list.replaceChildren(...cart.map((l, i) => el('div', { class: 'cartline' },
    el('div', { text: lineLabel(l) }),
    el('button', { class: 'x', text: '削除', onclick: () => { cart.splice(i, 1); updateBar(); } })
  )));
  if (!cart.length) list.append(el('div', { class: 'empty', text: 'まだ何も入っていません' }));
}

let sheetOpen = false;
function setSheet(open) {
  sheetOpen = open && cart.length > 0;
  $('sheet').classList.toggle('hidden', !sheetOpen);
  $('bar').classList.toggle('open', sheetOpen);
  if (sheetOpen) $('sheet').style.setProperty('--barh', $('bar').offsetHeight + 'px');
}
document.addEventListener('click', (e) => { if (e.target.closest('.bar .sum')) setSheet(!sheetOpen); });

function updateBar() {
  renderSheet();
  if (!cart.length) setSheet(false);
  else if (sheetOpen) setSheet(true);
  $('bar').classList.toggle('hidden', !cart.length || confirming);
  const n = cart.reduce((a, l) => a + l.qty, 0);
  $('barCount').textContent = 'カート ' + n + '点';
  const { t, unknown } = total();
  $('barTotal').textContent = unknown ? '金額は後日お知らせ' : yen(t);
}

$('barBtn').onclick = () => { if (isClosedNow()) { showClosed(); show('order'); return; } renderConfirm(); };

const KANA_RE = /^[ァ-ヶー・]+( [ァ-ヶー・]+)+$/;
const DEFAULT_PAY = '商品代金は、商品のお引き渡し時にお支払いいただきます。金額が決まり次第、改めてご案内いたします。';
const DEFAULT_CANCEL = '・注文のキャンセルは11/15（日）23:59まで、このページの「注文書・キャンセル」からできます。\n・受付期間を過ぎた後や、商品の受け渡し後のキャンセル・変更は、運営までご連絡ください。';

function renderConfirm() {
  const v = $('viewOrder');
  confirming = true;
  setSheet(false);
  $('bar').classList.add('hidden');
  const T = CONFIG.texts || {};
  const events = CONFIG.events || [];
  const evSel = new Set();
  const err = el('div', { class: 'err' });
  const nameInput = el('input', { type: 'text', placeholder: 'ヤマダ タロウ', value: customerName, maxlength: '30', autocomplete: 'off' });
  const tt = total();

  const list = el('div', {});
  const draw = () => {
    list.replaceChildren(...cart.map((l, i) => el('div', { class: 'cartline' },
      el('div', { text: lineLabel(l) }),
      el('button', { class: 'x', text: '削除', onclick: () => { cart.splice(i, 1); updateBar(); cart.length ? renderConfirm() : (renderOrder(), show('order')); } })
    )));
  };
  draw();

  const sumRows = el('div', { class: 'sumrows' });
  if (tt.unknown) {
    sumRows.append(el('div', { class: 'grand' }, el('span', { text: '合計' }), el('span', { text: '金額は決まり次第お知らせします' })));
  } else {
    sumRows.append(el('div', {}, el('span', { text: '小計' }), el('span', { text: yen(tt.sub) })));
    if (tt.disc > 0) sumRows.append(el('div', { class: 'disc' }, el('span', { text: tt.label }), el('span', { text: '-' + yen(tt.disc) })));
    sumRows.append(el('div', { class: 'grand' }, el('span', { text: '合計' }), el('span', { text: yen(tt.t) })));
    if (tt.provisional) sumRows.append(el('div', { style: 'display:block;font-size:12px;color:var(--mute)', text: '※ 価格が仮の商品を含みます。確定金額は決まり次第お知らせします。' }));
  }

  const kids = [
    el('h2', { text: '注文内容の確認' }),
    list, sumRows, discNote('hint'),
    el('label', {}, 'お名前 ', el('span', { class: 'hint', text: 'カタカナ・フルネーム（姓と名の間にスペース）' })),
    nameInput
  ];

  if (events.length) {
    const chips = el('div', { class: 'chips' }, ...events.map((e) => {
      const chip = el('div', { class: 'chip', text: e });
      chip.onclick = () => { evSel.has(e) ? evSel.delete(e) : evSel.add(e); chip.classList.toggle('on'); };
      return chip;
    }));
    kids.push(el('label', {}, '参加種目 ', el('span', { class: 'hint', text: '（複数選択可）' })), chips);
  }

  const payCheck = el('input', { type: 'checkbox' });
  const canCheck = el('input', { type: 'checkbox' });
  kids.push(
    el('label', { text: 'お支払いについて' }),
    el('div', { class: 'policy', text: T.payment || DEFAULT_PAY }),
    el('label', { class: 'agree' }, payCheck, el('span', { text: 'お支払いについて同意します' })),
    el('label', { text: 'キャンセルポリシー' }),
    el('div', { class: 'policy', text: T.cancel || DEFAULT_CANCEL }),
    el('label', { class: 'agree' }, canCheck, el('span', { text: 'キャンセルポリシーに同意します' })),
    err
  );
  const goBtn = el('button', { class: 'btn', text: '注文内容を最終確認へ' });
  kids.push(goBtn, el('button', { class: 'btn sub', text: '← 商品選択に戻る', onclick: () => { renderOrder(); show('order'); } }));
  v.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'body' }, ...kids)));
  window.scrollTo(0, 0);

  goBtn.onclick = () => {
    if (isClosedNow()) { showClosed(); show('order'); return; }
    err.textContent = '';
    const name = nameInput.value.trim().replace(/[ 　]+/g, ' ');
    if (!KANA_RE.test(name)) return (err.textContent = 'お名前はカタカナのフルネームで入力してください（姓と名の間にスペース）');
    if (events.length && !evSel.size) return (err.textContent = '参加種目を選んでください');
    if (!payCheck.checked) return (err.textContent = 'お支払いについての同意にチェックしてください');
    if (!canCheck.checked) return (err.textContent = 'キャンセルポリシーの同意にチェックしてください');
    customerName = name;
    openFinal(name, [...evSel], tt);
  };
}

function openFinal(name, evs, tt) {
  const close = () => modal.remove();
  const msg = el('div', { class: 'err' });
  const ok = el('button', { class: 'btn', text: '確定する' });
  const back = el('button', { class: 'btn sub', text: '戻る', onclick: close });
  const modal = el('div', { class: 'modal' }, el('div', { class: 'box' },
    el('h3', { text: 'この内容で注文を確定しますか？' }),
    el('div', { text: 'お名前：' + name }),
    evs.length ? el('div', { text: '参加種目：' + evs.join('、') }) : null,
    el('div', { text: '合計：' + (tt.unknown ? '金額は決まり次第お知らせします' : yen(tt.t)) }),
    el('div', { class: 'hint', style: 'margin-top:8px', text: '確定後のキャンセルは、受付期間内なら「注文書・キャンセル」から行えます。' }),
    msg,
    el('div', { class: 'btns' }, back, ok)
  ));
  document.body.append(modal);
  ok.onclick = async () => {
    if (isClosedNow()) { close(); showClosed(); show('order'); return; }
    ok.disabled = true; back.disabled = true; ok.textContent = '送信中…'; msg.textContent = '';
    try {
      const r = await api({ action: 'order', name, events: evs, agreed: true, lines: cart });
      if (!r.ok) throw new Error(r.error);
      try { localStorage.setItem('bk_last', JSON.stringify({ id: r.orderId, name })); } catch (e) {}
      cart = []; updateBar();
      close();
      renderDone(r.orderId);
    } catch (e) {
      msg.textContent = e.message || '送信に失敗しました。もう一度お試しください。';
      ok.disabled = false; back.disabled = false; ok.textContent = '確定する';
    }
  };
}

function renderDone(id) {
  $('viewDone').replaceChildren(el('div', { class: 'card' }, el('div', { class: 'body done' },
    el('div', { text: 'ご注文ありがとうございます！' }),
    el('div', { class: 'no', text: id }),
    el('p', { text: 'この注文番号（5桁）とお名前で、「注文書・キャンセル」から注文書を見られます。スクリーンショットで保存しておくと安心です。' }),
    el('p', { text: '商品代金は、商品のお引き渡し時にお支払いいただきます。' }),
    el('button', { class: 'btn sub', text: 'もう一度注文する', onclick: () => { renderOrder(); show('order'); } })
  )));
  show('done');
}

/* ---------- 注文書・キャンセル ---------- */
function renderCheck() {
  let last = {};
  try { last = JSON.parse(localStorage.getItem('bk_last') || '{}'); } catch (e) {}
  const idIn = el('input', { type: 'text', inputmode: 'numeric', maxlength: '5', placeholder: '12345', value: last.id || '' });
  const nameIn = el('input', { type: 'text', placeholder: 'ヤマダ タロウ', value: last.name || '' });
  const err = el('div', { class: 'err' });
  const out = el('div', {});
  const btn = el('button', { class: 'btn', text: '注文書を見る' });

  const kv = (k, val) => el('div', {}, el('span', { text: k }), el('span', { text: val }));
  const sumBlock = (r, hasActive) => {
    const b = el('div', { class: 'sumrows' });
    if (hasActive && r.total != null && r.disc > 0) {
      b.append(kv('小計', yen(r.sub)), el('div', { class: 'disc' }, el('span', { text: r.discLabel }), el('span', { text: '-' + yen(r.disc) })));
    }
    b.append(el('div', { class: 'grand' }, el('span', { text: '合計' }), el('span', { text: hasActive ? (r.total == null ? '金額は決まり次第お知らせします' : yen(r.total)) : '—' })));
    if (hasActive && r.provisional) b.append(el('div', { style: 'display:block;font-size:12px;color:var(--mute)', text: '※ 価格が仮の商品を含みます。確定金額は決まり次第お知らせします。' }));
    return b;
  };

  btn.onclick = async () => {
    err.textContent = ''; out.replaceChildren();
    const id = idIn.value.normalize('NFKC').trim();
    const name = nameIn.value.trim().replace(/[ 　]+/g, ' ');
    if (!/^\d{5}$/.test(id)) return (err.textContent = '注文番号は5桁の数字です');
    if (!KANA_RE.test(name)) return (err.textContent = 'お名前はカタカナのフルネームで入力してください（姓と名の間にスペース）');
    btn.disabled = true;
    try {
      const r = await api({ action: 'lookup', orderId: id, name });
      if (!r.ok) throw new Error(r.error);
      const active = r.lines.filter((l) => l.state !== 'キャンセル');
      const closedNow = r.closed || isClosedNow();
      const rows = el('div', { class: 'sumrows' },
        kv('お名前', r.name),
        kv('受付日時', r.placedAt),
        r.events ? kv('参加種目', r.events) : null,
        kv('状態', active.length ? '受付済み' : 'キャンセル済み')
      );
      const items = r.lines.map((l) => el('div', { class: 'cartline', style: l.state === 'キャンセル' ? 'text-decoration:line-through;color:var(--mute)' : '' },
        el('div', { text: lineLabel({ itemName: l.item, color: l.color, logo: l.logo, printName: l.printName, numbers: l.numbers.length ? l.numbers : null, size: l.size, qty: l.qty }) })));
      const slip = el('div', { class: 'card', style: 'margin-top:14px' }, el('div', { class: 'body' },
        el('h2', { text: '注文書' }),
        el('div', { class: 'no', text: '注文番号 ' + r.orderId }),
        rows,
        el('label', { text: 'ご注文内容' }),
        ...items,
        sumBlock(r, active.length > 0),
        el('div', { class: 'hint', style: 'margin-top:8px', text: '商品代金は、商品のお引き渡し時にお支払いいただきます。' }),
        active.length && !closedNow ? el('button', { class: 'btn danger', text: 'この注文をキャンセルする', onclick: async (ev) => {
          if (!confirm('この注文をすべてキャンセルします。よろしいですか？')) return;
          ev.target.disabled = true;
          try {
            const c = await api({ action: 'cancel', orderId: id, name });
            if (!c.ok) throw new Error(c.error);
            out.replaceChildren(el('div', { class: 'notice', style: 'margin-top:14px', text: 'キャンセルしました。' }));
          } catch (e) { err.textContent = e.message; ev.target.disabled = false; }
        } }) : (active.length ? el('div', { class: 'hint', style: 'margin-top:10px', text: '受付期間を過ぎたため、変更・キャンセルは運営までご連絡ください。' }) : null)
      ));
      out.append(slip);
    } catch (e) { err.textContent = e.message || '失敗しました'; }
    btn.disabled = false;
  };

  $('viewCheck').replaceChildren(el('div', { class: 'card' }, el('div', { class: 'body' },
    el('h2', { text: '注文書・キャンセル' }),
    el('div', { class: 'hint', text: '注文番号（5桁）とお名前（カタカナ）で、ご自身の注文書を見られます。' }),
    el('label', { text: '注文番号（5桁）' }), idIn,
    el('label', { text: 'お名前（カタカナ・フルネーム）' }), nameIn,
    err, btn
  )), out);
}

init();
</script>
</body>
</html>
